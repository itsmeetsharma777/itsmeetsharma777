name: Update 3D Contribution Heatmap

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install generator dependencies
        run: pip install --disable-pip-version-check requests

      - name: Generate animated 3D contribution heatmap
        env:
          GITHUB_USERNAME: itsmeetsharma777
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: assets/contribution-3d.svg
        run: python scripts/generate_3d_contributions.py

      - name: Add contribution statistics around the heatmap
        env:
          GITHUB_USERNAME: itsmeetsharma777
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: assets/contribution-3d.svg
        run: python scripts/add_contribution_stats.py

      - name: Remove legacy GIF if present
        run: git rm -f assets/contribution-3d.gif 2>/dev/null || true

      - name: Commit generated contribution dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-3d.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update contribution dashboard"
          git push
