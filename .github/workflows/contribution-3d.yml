name: Update 3D Contribution Dashboard

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: pip install --disable-pip-version-check requests

      - name: Generate real contribution dashboard
        env:
          GITHUB_USERNAME: itsmeetsharma777
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: assets/contribution-3d.svg
        run: |
          python scripts/generate_3d_contributions.py
          python scripts/add_contribution_stats.py

      - name: Commit dashboard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-3d.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh contribution dashboard"
          git push
