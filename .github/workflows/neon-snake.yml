name: Generate Neon Contribution Snake

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/neon-snake.yml"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23a855f7&color_dots=%230b1020%231b2745%2322d3ee%23a855f7%23f472b6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
