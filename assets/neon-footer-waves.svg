<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-label="Animated neon energy portal footer">
<defs>
  <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#EC4899"/><stop offset="28%" stop-color="#A855F7"/>
    <stop offset="52%" stop-color="#6366F1"/><stop offset="76%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#22D3EE"/>
    <animate attributeName="x1" values="0%;35%;0%" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;65%;100%" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="12%" stop-color="#C084FC" stop-opacity=".9"/><stop offset="38%" stop-color="#8B5CF6" stop-opacity=".45"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/><stop offset="45%" stop-color="#A855F7" stop-opacity=".8"/><stop offset="100%" stop-color="#F472B6" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#64748B" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1600" height="240" fill="#080C14"/>
<rect y="145" width="1600" height="95" fill="url(#grid)"/>

<path d="M-80 205 C180 155 370 225 625 177 S1110 145 1680 193" fill="none" stroke="url(#aurora)" stroke-width="18" opacity=".16" filter="url(#glow)">
  <animate attributeName="stroke-dasharray" values="20 30;90 45;20 30" dur="8s" repeatCount="indefinite"/>
</path>
<path d="M-80 205 C180 155 370 225 625 177 S1110 145 1680 193" fill="none" stroke="url(#aurora)" stroke-width="2.5" opacity=".9">
  <animate attributeName="stroke-dashoffset" values="0;-300;0" dur="10s" repeatCount="indefinite"/>
</path>

<g transform="translate(800 125)">
  <circle r="88" fill="url(#core)" opacity=".24" filter="url(#glow)"><animate attributeName="r" values="68;108;68" dur="6s" repeatCount="indefinite"/></circle>
  <ellipse rx="230" ry="48" fill="none" stroke="url(#aurora)" stroke-width="2" opacity=".7">
    <animateTransform attributeName="transform" type="rotate" values="-7;353;-7" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="155" ry="31" fill="none" stroke="#C084FC" stroke-width="1.5" opacity=".55">
    <animateTransform attributeName="transform" type="rotate" values="18;378;18" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <circle r="17" fill="url(#core)" filter="url(#smallGlow)"><animate attributeName="r" values="10;21;10" dur="4s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#22D3EE" filter="url(#smallGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M-230 0 C-100 -48 100 48 230 0"/>
  </circle>
  <circle r="3" fill="#F472B6" filter="url(#smallGlow)">
    <animateMotion dur="9s" repeatCount="indefinite" path="M155 0 C60 55 -60 -55 -155 0"/>
  </circle>
</g>

<g opacity=".7" filter="url(#smallGlow)">
  <path d="M120 40 L430 180" stroke="url(#beam)" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="-180 0;1350 0;-180 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path d="M1280 35 L1010 190" stroke="url(#beam)" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="250 0;-1500 0;250 0" dur="17s" repeatCount="indefinite"/>
  </path>
</g>

<g fill="#C084FC" filter="url(#smallGlow)">
  <circle cx="180" cy="82" r="2.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="145" r="2"><animate attributeName="opacity" values="1;.15;1" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="62" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="78" r="2"><animate attributeName="opacity" values="1;.1;1" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="1260" cy="142" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="3.9s" repeatCount="indefinite"/></circle>
  <circle cx="1430" cy="68" r="2"><animate attributeName="opacity" values=".8;.1;.8" dur="5s" repeatCount="indefinite"/></circle>
</g>
<g fill="#22D3EE" filter="url(#smallGlow)">
  <circle cx="250" cy="175" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="45" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="55" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="1360" cy="175" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="5.1s" repeatCount="indefinite"/></circle>
</g>
<path d="M70 34 H1530" stroke="url(#aurora)" stroke-width="1" opacity=".22"><animate attributeName="opacity" values=".08;.5;.08" dur="6s" repeatCount="indefinite"/></path>
</svg>