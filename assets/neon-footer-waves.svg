<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-label="Animated neon aurora footer">
<defs>
  <filter id="blur" x="-40%" y="-100%" width="180%" height="300%">
    <feGaussianBlur stdDeviation="32"/>
  </filter>
  <radialGradient id="cyan">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".48"/>
    <stop offset=".55" stop-color="#0891b2" stop-opacity=".16"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violet">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#6d28d9" stop-opacity=".14"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blue">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
    <stop offset=".55" stop-color="#2563eb" stop-opacity=".12"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="240" fill="#000000"/>
<g filter="url(#blur)">
  <ellipse cx="170" cy="150" rx="300" ry="95" fill="url(#cyan)">
    <animate attributeName="cx" values="170;520;930;1320;170" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;95;165;110;150" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="900" cy="90" rx="330" ry="100" fill="url(#violet)">
    <animate attributeName="cx" values="900;1240;620;220;900" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;145;75;130;90" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1420" cy="165" rx="280" ry="85" fill="url(#blue)">
    <animate attributeName="cx" values="1420;1080;720;1420" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="165;105;155;165" dur="12s" repeatCount="indefinite"/>
  </ellipse>
</g>
<rect x="0" y="0" width="1600" height="240" fill="none" stroke="#101820" stroke-width="1"/>
</svg>