<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Meet Sharma — Computer Science Engineer</title>
  <desc id="desc">Animated dark neon developer profile header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0b1025"/>
      <stop offset="1" stop-color="#16071f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowC"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP"><stop stop-color="#a855f7" stop-opacity=".28"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1400" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="28" fill="url(#grid)"/>
  <circle cx="150" cy="80" r="190" fill="url(#glowC)" filter="url(#blur)">
    <animate attributeName="cx" values="150;250;150" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1230" cy="330" r="230" fill="url(#glowP)" filter="url(#blur)">
    <animate attributeName="cy" values="330;230;330" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="20" y="20" width="1360" height="390" rx="20" fill="none" stroke="url(#neon)" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="40 260;180 120;40 260" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="29" y="29" width="1342" height="372" rx="16" fill="none" stroke="#fff" stroke-opacity=".07"/>

  <g transform="translate(92 92)">
    <circle cx="0" cy="0" r="54" fill="#07101f" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="43" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="7 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="34" font-weight="700" fill="#e2e8f0">MS</text>
  </g>

  <text x="92" y="190" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">MEET SHARMA</text>
  <text x="96" y="235" font-family="monospace" font-size="20" fill="#67e8f9">COMPUTER SCIENCE • FULL-STACK • DSA</text>
  <rect x="96" y="260" width="620" height="2" rx="1" fill="url(#neon)"/>
  <text x="96" y="302" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#cbd5e1">Building useful software, learning deeply, shipping consistently.</text>

  <g transform="translate(970 90)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#22d3ee" stroke-opacity=".18" stroke-width="1"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#a855f7" stroke-opacity=".24" stroke-width="2" stroke-dasharray="4 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="49" fill="#0b1224" stroke="url(#neon)" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700" fill="#f8fafc">&lt;/&gt;</text>
    <circle cx="0" cy="-115" r="5" fill="#22d3ee">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="monospace" font-size="14" fill="#94a3b8">
    <text x="96" y="352">JAVA</text><text x="170" y="352">C++</text><text x="244" y="352">REACT</text><text x="335" y="352">NODE</text><text x="414" y="352">MONGODB</text><text x="530" y="352">GIT</text>
  </g>
</svg>
