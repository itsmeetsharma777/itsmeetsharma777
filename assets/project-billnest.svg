<rect x="250" y="275" width="135" height="52" rx="26" fill="url(#chip)" stroke="#55377a"/><text x="317.5" y="308" text-anchor="middle" class="pill">Vite</text>
<rect x="400" y="275" width="205" height="52" rx="26" fill="url(#chip)" stroke="#55377a"/><text x="502.5" y="308" text-anchor="middle" class="pill">Express.js</text>
