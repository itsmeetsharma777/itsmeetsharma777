<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="250" viewBox="0 0 1400 250">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d0918"/>
    <stop offset="0.55" stop-color="#100b20"/>
    <stop offset="1" stop-color="#160b1e"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#FB7185"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 28px 'DejaVu Sans',Arial,sans-serif;fill:#f7f2ff}
    .sub{font:700 13px 'DejaVu Sans',Arial,sans-serif;fill:#c98cff;letter-spacing:2px}
    .desc{font:400 16px 'DejaVu Sans',Arial,sans-serif;fill:#c9c2d5}
    .pill{font:500 13px 'DejaVu Sans Mono',monospace;fill:#ded6eb}
    .num{font:700 14px 'DejaVu Sans Mono',monospace;fill:#b9a9c9}
    .arrow{font:700 26px 'DejaVu Sans',Arial,sans-serif;fill:#f0b2ff}
  </style>
</defs>
<rect x="5" y="5" width="1390" height="240" rx="28" fill="url(#bg)" stroke="#38254e"/>
<rect x="5" y="5" width="8" height="240" rx="4" fill="url(#line)" filter="url(#glow)"/>
<circle cx="74" cy="70" r="38" fill="#21102e" stroke="#A855F7" stroke-width="2"/>
<text x="74" y="80" text-anchor="middle" font-size="28" fill="#f2d8ff">◆</text>
<text x="135" y="56" class="num">03 / FEATURED PROJECT</text>
<text x="135" y="92" class="title">BillNest</text>
<text x="135" y="119" class="sub">GST BILLING • WARRANTY • PDF</text>
<text x="135" y="151" class="desc">A responsive billing and warranty platform for shops, customers and secure PDF invoices.</text>
