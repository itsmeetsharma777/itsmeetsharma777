<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0918"/><stop offset="0.55" stop-color="#120b21"/><stop offset="1" stop-color="#1b0b21"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1230"/><stop offset="1" stop-color="#120d20"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .eyebrow{font:700 16px 'DejaVu Sans Mono',monospace;fill:#c98cff;letter-spacing:2px}
    .title{font:700 44px 'DejaVu Sans',Arial,sans-serif;fill:#faf7ff}
    .desc{font:400 21px 'DejaVu Sans',Arial,sans-serif;fill:#c9c2d5}
    .label{font:700 15px 'DejaVu Sans Mono',monospace;fill:#9d8ab3;letter-spacing:2px}
    .pill{font:700 18px 'DejaVu Sans Mono',monospace;fill:#eee6f8}
    .open{font:700 17px 'DejaVu Sans Mono',monospace;fill:#f0b2ff;letter-spacing:1px}
  </style>
</defs>
<rect x="6" y="6" width="988" height="608" rx="32" fill="url(#bg)" stroke="#3b2851" stroke-width="2"/>
<rect x="6" y="6" width="10" height="608" rx="5" fill="url(#accent)" filter="url(#glow)"/>
<circle cx="78" cy="78" r="38" fill="#21102e" stroke="#A855F7" stroke-width="2"/>
